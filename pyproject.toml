[project]
name = "emergent"
version = "0.6.0"
description = "Type-safe DSLs for common patterns. Composable, local-first, lazy."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "prostomarkeloff" }
]
license = { text = "MIT" }

dependencies = [
    "kungfu-fp @ git+https://github.com/timoniq/kungfu.git",
    "combinators-py @ git+https://github.com/prostomarkeloff/combinators.py.git",
    "nodnod @ git+https://github.com/timoniq/nodnod.git"
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.350",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
cli = [
    "libcst>=1.0",
]
sa = [
    "aiosqlite>=0.22.1",
    "sqlalchemy>=2.0.46",
]

[project.scripts]
emergent-cli = "emergent_cli.cli:main"
emergent-meta = "emergent_meta.contrib.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.hatch.build.targets.wheel]
packages = ["emergent", "derivelib/src/derivelib"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.workspace]
members = ["derivelib"]

[dependency-groups]
dev = [
    "fastapi>=0.115.0",
    "greenlet>=3.3.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
    "uvicorn>=0.30.0",
]
