[project]
name = "emergent"
version = "0.9.0"
description = "Type-safe DSLs for common patterns. Composable, local-first, lazy."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "prostomarkeloff" }
]
license = { text = "MIT" }

dependencies = [
    "kungfu-fp>=1.0.0",
    "combinators-py @ git+https://github.com/prostomarkeloff/combinators.py.git",
    "nodnod>=1.0.1",
]

[project.optional-dependencies]
# Compilation targets — install what you compile to
fastapi = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
sa = [
    "aiosqlite>=0.22.1",
    "sqlalchemy>=2.0.46",
]
tg = [
    "telegrinder @ git+https://github.com/timoniq/telegrinder.git ; python_version >= '3.14'",
]
cli = [
    "libcst>=1.0",
]
# All optional targets
all = [
    "emergent[fastapi,sa,tg,cli]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (skipped in light mode)",
]
asyncio_mode = "strict"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.hatch.build.targets.wheel]
packages = ["emergent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.workspace]
members = []

[dependency-groups]
dev = [
    "emergent[all]",
    "greenlet>=3.3.1",
    "httpx>=0.28.1",
    "hypothesis>=6.0",
    "hypofuzz>=25.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-gremlins>=1.5",
    "pyright>=1.1.408",
    "ruff>=0.14.11",
    "schemathesis>=4.0",
]
