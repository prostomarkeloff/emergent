[project]
name = "derivelib"
version = "0.1.0"
description = "Algebraic derivation system over emergent.wire's sheaf architecture."
requires-python = ">=3.13"
authors = [
    { name = "prostomarkeloff" }
]
license = { text = "MIT" }

dependencies = [
    "emergent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/derivelib"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
emergent = { workspace = true }
